version: "3.9"
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://clashbound:clashbound@db:5432/clashbound
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=clashbound
      - POSTGRES_PASSWORD=clashbound
      - POSTGRES_DB=clashbound
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
